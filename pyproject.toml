[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kfpa"
version = "0.1.0"
description = "KFPA —— 知识优先的流水线式多智能体软件生产架构（P0 最小闭环）"
readme = "README.md"
requires-python = ">=3.10"
# P0 必需：编排（D1-12 用 LangGraph）、模板、角色配置、模型路由。
# 由 Chief 统一安装，成员不得自行 pip install / 建 venv。
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "langgraph>=1.0",
    "litellm>=1.100",
]

[project.optional-dependencies]
# 惰性导入的可选适配器（D1-0 / D1-5 退出码 4）：缺包必须中文报错，不崩。
exec = ["aider-chat"]
ui = ["streamlit"]
dev = ["pytest"]

[project.scripts]
kfpa = "kfpa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kfpa" = ["prompts/*.j2"]

# pytest 直接吃 src 布局：镜鉴不需要先装包也能跑 tests/
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
