# KFPA P1：PostgreSQL 16（D3 §1.5 / §5）
# 端口固定 55432:5432 —— 不占用本机 5432（D3 明确要求）。
# 用法：
#   docker compose -f docker-compose.pg.yml up -d
#   KFPA_DB_URL=postgresql://kfpa:kfpa@127.0.0.1:55432/kfpa python -m kfpa init
#   docker compose -f docker-compose.pg.yml down          # 停容器、保留数据卷
#   docker compose -f docker-compose.pg.yml down -v       # 连数据卷一起删（成员勿自行执行，D3 §1.4）
services:
  pg:
    image: postgres:16-alpine
    # R-24.2：**不使用固定 `container_name`** —— 固定全局名会让多个工作树 / 多个 clone /
    # 台架与人工实例互相撞名（实测撞过）。交给 Compose 按项目前缀命名（<project>-pg-1），
    # 各人可用 `-p <项目名>` 起独立栈。
    restart: unless-stopped
    environment:
      POSTGRES_USER: kfpa
      POSTGRES_PASSWORD: kfpa
      POSTGRES_DB: kfpa
      # 保证按 UTF-8 / C 排序初始化，避免不同宿主机排序规则差异影响对拍
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # 默认 55440（D2 R-22.1）。本机 55432/55433/55434 已被其它项目占用，KFPA 不得使用；
      # 需要更换时：$env:KFPA_PG_PORT="55441"; docker compose -f docker-compose.pg.yml up -d
      - "${KFPA_PG_PORT:-55440}:5432"
    healthcheck:
      # pg_isready 通过后 up -d 才能视为「可用」，A12 对拍前先等健康
      test: ["CMD-SHELL", "pg_isready -U kfpa -d kfpa -h 127.0.0.1"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - kfpa-pg-data:/var/lib/postgresql/data

volumes:
  kfpa-pg-data:
